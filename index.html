<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Storyboards - Grupo Don K</title>
    <style>
        :root { --brand: #273D70; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.4s ease;
        }

        /* TEMAS POR MARCA */
        body.theme-vizion { background: linear-gradient(135deg, #273D70 0%, #1a2547 100%); }
        body.theme-yoho { background: linear-gradient(135deg, #3D8890 0%, #2c5f67 100%); }
        body.theme-pastor { background: linear-gradient(135deg, #8B3A3A 0%, #5C2626 100%); }
        body.theme-donk-corp { background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%); }
        body.theme-donk-rest { background: linear-gradient(135deg, #1B3A8C 0%, #0f2456 100%); }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* HEADER CON LOGO */
        .header {
            padding: 30px 40px;
            background: linear-gradient(90deg, #273D70 0%, #1a2547 100%);
            display: flex;
            align-items: center;
            gap: 30px;
            transition: background 0.4s ease;
        }
        body.theme-vizion .header { background: linear-gradient(90deg, #273D70 0%, #1a2547 100%); }
        body.theme-yoho .header { background: linear-gradient(90deg, #3D8890 0%, #2c5f67 100%); }
        body.theme-pastor .header { background: linear-gradient(90deg, #8B3A3A 0%, #5C2626 100%); }
        body.theme-donk-corp .header { background: linear-gradient(90deg, #333333 0%, #1a1a1a 100%); }
        body.theme-donk-rest .header { background: linear-gradient(90deg, #1B3A8C 0%, #0f2456 100%); }

        .logo-container {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-fallback {
            display: none;
            font-weight: 800;
            font-size: 28px;
            color: var(--brand);
            text-align: center;
            line-height: 1;
        }

        .header-text h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-text p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }

        /* CONTENIDO PRINCIPAL */
        .content { padding: 40px; }

        .form-section { margin-bottom: 30px; }

        .form-section h2 {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #273D70;
            border-radius: 2px;
            transition: background 0.4s ease;
        }
        body.theme-vizion .form-section h2::before { background: #273D70; }
        body.theme-yoho .form-section h2::before { background: #3D8890; }
        body.theme-pastor .form-section h2::before { background: #8B3A3A; }
        body.theme-donk-corp .form-section h2::before { background: #333333; }
        body.theme-donk-rest .form-section h2::before { background: #E8791E; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .form-grid-full {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        .scene > .form-group { margin-bottom: 20px; }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        input[type="text"], textarea { text-transform: uppercase; }
        input[type="text"]::placeholder, textarea::placeholder { text-transform: none; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #273D70;
            background: white;
            box-shadow: 0 0 0 3px rgba(39, 61, 112, 0.1);
        }
        body.theme-yoho input:focus, body.theme-yoho select:focus, body.theme-yoho textarea:focus {
            border-color: #3D8890; box-shadow: 0 0 0 3px rgba(61, 136, 144, 0.1);
        }
        body.theme-pastor input:focus, body.theme-pastor select:focus, body.theme-pastor textarea:focus {
            border-color: #8B3A3A; box-shadow: 0 0 0 3px rgba(139, 58, 58, 0.1);
        }
        body.theme-donk-corp input:focus, body.theme-donk-corp select:focus, body.theme-donk-corp textarea:focus {
            border-color: #333333; box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }
        body.theme-donk-rest input:focus, body.theme-donk-rest select:focus, body.theme-donk-rest textarea:focus {
            border-color: #1B3A8C; box-shadow: 0 0 0 3px rgba(27, 58, 140, 0.1);
        }

        /* Aviso visual cuando el autocorrector arregla una palabra */
        .campo-corregido { border-color: #2e7d32 !important; }

        /* FORMATO DEL VIDEO */
        .formato-opciones {
            display: flex;
            gap: 12px;
        }
        .formato-opcion {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 0;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .formato-opcion input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .formato-opcion.activa {
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
        }
        .formato-opcion:focus-within { box-shadow: 0 0 0 3px rgba(39, 61, 112, 0.2); }
        .formato-icono {
            background: #cfd5df;
            border-radius: 3px;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .formato-opcion.activa .formato-icono { background: var(--brand); }
        .formato-icono.h { width: 34px; height: 20px; }
        .formato-icono.v { width: 20px; height: 34px; }
        .formato-opcion small {
            display: block;
            font-weight: 500;
            color: #777;
            font-size: 11px;
            margin-top: 2px;
        }

        /* REFERENCIA VISUAL DEL PLANO */
        .plano-preview {
            display: none;
            margin: -4px 0 24px;
            padding: 16px;
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 8px;
            gap: 20px;
            align-items: center;
        }
        .plano-preview.visible { display: flex; }
        .plano-preview svg {
            flex-shrink: 0;
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .plano-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand);
            margin-bottom: 4px;
        }
        .plano-info p {
            font-size: 12px;
            color: #555;
            line-height: 1.45;
            margin-bottom: 12px;
            max-width: 46ch;
        }
        .plano-info p:last-child { margin-bottom: 0; }

        /* AGREGAR ESCENAS */
        .add-scene-btn {
            background: linear-gradient(135deg, #273D70 0%, #1a2547 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        body.theme-yoho .add-scene-btn { background: linear-gradient(135deg, #3D8890 0%, #2c5f67 100%); }
        body.theme-pastor .add-scene-btn { background: linear-gradient(135deg, #8B3A3A 0%, #5C2626 100%); }
        body.theme-donk-corp .add-scene-btn { background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%); }
        body.theme-donk-rest .add-scene-btn { background: linear-gradient(135deg, #1B3A8C 0%, #0f2456 100%); }
        .add-scene-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 61, 112, 0.3);
        }
        .add-scene-btn::before {
            content: '+';
            font-size: 18px;
            font-weight: bold;
        }

        /* ESCENAS */
        .scenes-container { margin-top: 30px; }

        .scene {
            background: #f9f9f9;
            border-left: 4px solid #273D70;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        body.theme-yoho .scene { border-left-color: #3D8890; }
        body.theme-pastor .scene { border-left-color: #8B3A3A; }
        body.theme-donk-corp .scene { border-left-color: #333333; }
        body.theme-donk-rest .scene { border-left-color: #E8791E; }
        .scene:hover {
            background: #f2f2f2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .scene-number {
            font-weight: 700;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
        }
        .remove-scene-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .remove-scene-btn:hover { background: #ff5252; }

        /* BOTÓN SUBMIT */
        .submit-btn {
            background: linear-gradient(135deg, #273D70 0%, #1a2547 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        body.theme-yoho .submit-btn { background: linear-gradient(135deg, #3D8890 0%, #2c5f67 100%); }
        body.theme-pastor .submit-btn { background: linear-gradient(135deg, #8B3A3A 0%, #5C2626 100%); }
        body.theme-donk-corp .submit-btn { background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%); }
        body.theme-donk-rest .submit-btn { background: linear-gradient(135deg, #E8791E 0%, #c85f0a 100%); }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 61, 112, 0.4);
        }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.7; cursor: wait; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            .form-grid { grid-template-columns: 1fr; }
            .content { padding: 20px; }
            .header-text h1 { font-size: 22px; }
            .formato-opciones { flex-direction: column; }
            .plano-preview { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER CON LOGO -->
        <div class="header">
            <div class="logo-container">
                <img id="brandLogo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M8AAAMEAYHu2fVHAAAAAElFTkSuQmCC" alt="Logo de marca">
                <span class="logo-fallback" id="logoFallback"></span>
            </div>
            <div class="header-text">
                <h1 id="headerTitle">Generador de Storyboards</h1>
                <p id="headerSubtitle">Grupo Don K</p>
            </div>
        </div>

        <!-- FORMULARIO -->
        <div class="content">
            <form id="storyboardForm" autocomplete="off">
                <!-- INFORMACIÓN DE LA CAMPAÑA -->
                <div class="form-section">
                    <h2>Información de la campaña</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="marca">¿Para cuál marca?</label>
                            <select id="marca" required>
                                <option value="">Selecciona una marca...</option>
                                <option value="vizion">VIZIÓN DE LOS ALTOS</option>
                                <option value="donk-restaurant">DON K RESTAURANT</option>
                                <option value="yoho">YOHO HIELO</option>
                                <option value="pastor">PASTOR DON K</option>
                                <option value="donk-corp">GRUPO DON K (CORPORATIVO)</option>
                            </select>
                        </div>

                        <!-- SUBCATEGORÍA - SOLO VIZIÓN -->
                        <div class="form-group" id="pillarGroup" style="display: none;">
                            <label for="pilar">Pilar de contenido</label>
                            <select id="pilar">
                                <option value="">Selecciona un pilar...</option>
                                <option value="01-venta">01 - VENTA</option>
                                <option value="02-promocion">02 - PROMOCIÓN</option>
                                <option value="03-informativo">03 - INFORMATIVO</option>
                                <option value="04-educativo">04 - EDUCATIVO</option>
                                <option value="05-creativo">05 - CREATIVO</option>
                                <option value="06-empresa">06 - EMPRESA</option>
                                <option value="07-entretenimiento">07 - ENTRETENIMIENTO</option>
                                <option value="08-colaboraciones">08 - COLABORACIONES</option>
                                <option value="09-storytelling">09 - STORYTELLING</option>
                            </select>
                        </div>

                        <!-- SUBCATEGORÍA - DON K RESTAURANT -->
                        <div class="form-group" id="restaurantGroup" style="display: none;">
                            <label for="restaurant">Tipo de establecimiento</label>
                            <select id="restaurant">
                                <option value="">Selecciona...</option>
                                <option value="bar">BAR DON K</option>
                                <option value="restaurante">RESTAURANTE</option>
                            </select>
                        </div>

                        <!-- MES Y AÑO -->
                        <div class="form-group">
                            <label for="mesSel">Mes</label>
                            <select id="mesSel" required>
                                <option value="">Mes...</option>
                                <option value="01">ENERO</option>
                                <option value="02">FEBRERO</option>
                                <option value="03">MARZO</option>
                                <option value="04">ABRIL</option>
                                <option value="05">MAYO</option>
                                <option value="06">JUNIO</option>
                                <option value="07">JULIO</option>
                                <option value="08">AGOSTO</option>
                                <option value="09">SEPTIEMBRE</option>
                                <option value="10">OCTUBRE</option>
                                <option value="11">NOVIEMBRE</option>
                                <option value="12">DICIEMBRE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="anoSel">Año</label>
                            <select id="anoSel" required>
                                <option value="">Año...</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="videoName">Nombre del video</label>
                            <input type="text" id="videoName" placeholder="Ej: Cata de Tequila Trujillo" required spellcheck="true" autocapitalize="characters">
                        </div>

                        <div class="form-group">
                            <label for="scriptLink">Link del guión (opcional)</label>
                            <input type="url" id="scriptLink" placeholder="https://docs.google.com/...">
                        </div>
                    </div>

                    <!-- FORMATO DEL VIDEO -->
                    <div class="form-group">
                        <label>Formato del video</label>
                        <div class="formato-opciones">
                            <label class="formato-opcion">
                                <input type="radio" name="formato" value="horizontal" required>
                                <span class="formato-icono h"></span>
                                <span>Horizontal<small>16:9 · Pantallas LED, YouTube</small></span>
                            </label>
                            <label class="formato-opcion">
                                <input type="radio" name="formato" value="vertical">
                                <span class="formato-icono v"></span>
                                <span>Vertical<small>9:16 · Reels, TikTok, Historias</small></span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- ESCENAS -->
                <div class="form-section">
                    <h2>Escenas</h2>
                    <div class="scenes-container" id="scenesContainer"></div>
                    <button type="button" class="add-scene-btn" onclick="addScene()">Agregar escena</button>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">Crear Storyboard en Google Drive</button>
            </form>
        </div>
    </div>

    <!-- SUGERENCIAS DE AUTOCOMPLETADO -->
    <datalist id="lista-locaciones">
        <option value="INTERIOR"><option value="EXTERIOR"><option value="FACHADA"><option value="RECEPCIÓN">
        <option value="MOSTRADOR"><option value="OFICINA"><option value="BODEGA"><option value="COCINA">
        <option value="BARRA"><option value="SALÓN"><option value="TERRAZA"><option value="ESTACIONAMIENTO">
        <option value="CALLE"><option value="SUCURSAL"><option value="ÁREA DE PRODUCCIÓN"><option value="SALA DE ESPERA">
        <option value="CONSULTORIO"><option value="TIENDA"><option value="JARDÍN"><option value="RANCHO">
    </datalist>
    <datalist id="lista-actores">
        <option value="CLIENTE"><option value="DUEÑO DEL NEGOCIO"><option value="ENCARGADO"><option value="EMPLEADO">
        <option value="MESERO"><option value="COCINERO"><option value="DOCTOR"><option value="PACIENTE">
        <option value="FAMILIA"><option value="PAREJA"><option value="GRUPO DE AMIGOS"><option value="NIÑO">
        <option value="PRODUCTO"><option value="LOGOTIPO"><option value="SIN ACTORES">
    </datalist>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // Pega aquí la URL de tu Apps Script (Implementar > Aplicación web)
        // Termina en /exec
        // ============================================
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKtlJ6crBl_g6svc5cr7k0anCEgutZo0IMPv5zc8CQAIeXfwasYJV0RQSmjfwp3aE/exec';

        // DATOS DE MARCAS Y LOGOS

        // ============================================

        // ============================================
        const DICC = {};
        (
            'CAMARA:CÁMARA,CAMARAS:CÁMARAS,LOCACION:LOCACIÓN,LOCACIONES:LOCACIONES,VIZION:VIZIÓN,' +
            'DIALOGO:DIÁLOGO,DIALOGOS:DIÁLOGOS,GUION:GUIÓN,MUSICA:MÚSICA,GRAFICO:GRÁFICO,GRAFICOS:GRÁFICOS,' +

            'MEXICO:MÉXICO,TEPATITLAN:TEPATITLÁN,DONK:DON K,YOJO:YOHO,' +
            'MANANA:MAÑANA,ANO:AÑO,ANOS:AÑOS,NINO:NIÑO,NINA:NIÑA,NINOS:NIÑOS,NINAS:NIÑAS,DUENO:DUEÑO,DUENA:DUEÑA,' +
            'SENOR:SEÑOR,SENORA:SEÑORA,DISENO:DISEÑO,PEQUENO:PEQUEÑO,PEQUENA:PEQUEÑA,COMPANIA:COMPAÑÍA,' +
            'ESPANOL:ESPAÑOL,TAMANO:TAMAÑO,BANO:BAÑO,BANOS:BAÑOS,' +
            'Q:QUE,XQ:PORQUE,PQ:PORQUE,TMB:TAMBIÉN,TBN:TAMBIÉN,VOS:VOZ,EFECTOS:EFECTOS,' +
            'PROMO:PROMO,PRODUCTOS:PRODUCTOS,FACHADA:FACHADA'
        ).split(',').forEach(par => {
            const [mal, bien] = par.split(':');
            if (mal && bien && mal !== bien) DICC[mal] = bien;
        });

        function corregirPalabra(w) {
            if (DICC[w]) return DICC[w];
            // Regla general: palabras terminadas en -CION / -SION llevan acento (ACCION → ACCIÓN)
            if (w.length > 4 && /[CS]ION$/.test(w)) return w.slice(0, -2) + 'ÓN';
            return w;
        }

        function esCampoTexto(el) {
            return el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text');
        }

        function marcarCorregido(el) {
            el.classList.add('campo-corregido');
            clearTimeout(el._tCorr);
            el._tCorr = setTimeout(() => el.classList.remove('campo-corregido'), 600);
        }

        // Mientras escribe: mayúsculas + corrige la palabra anterior al dar espacio o signo
        document.getElementById('storyboardForm').addEventListener('input', function (e) {
            const el = e.target;
            if (!esCampoTexto(el)) return;

            let pos = el.selectionStart;
            let v = el.value.toUpperCase();
            let corregido = false;

            const borrando = e.inputType && e.inputType.indexOf('delete') === 0;
            if (!borrando && pos > 1 && /[\s.,;:!?)\n]/.test(v.charAt(pos - 1))) {
                const antes = v.slice(0, pos - 1);
                const m = antes.match(/([A-ZÁÉÍÓÚÜÑ]+)$/);
                if (m) {
                    const w = m[1];
                    const fix = corregirPalabra(w);
                    if (fix !== w) {
                        v = antes.slice(0, antes.length - w.length) + fix + v.slice(pos - 1);
                        pos += fix.length - w.length;
                        corregido = true;
                    }
                }
            }

            if (v !== el.value) {
                el.value = v;
                el.setSelectionRange(pos, pos);
            }
            if (corregido) marcarCorregido(el);
        });

        // Al salir del campo: revisa todo el texto
        document.getElementById('storyboardForm').addEventListener('focusout', function (e) {
            const el = e.target;
            if (!esCampoTexto(el)) return;
            const nuevo = el.value.toUpperCase()
                .replace(/[A-ZÁÉÍÓÚÜÑ]+/g, corregirPalabra)
                .replace(/[ \t]{2,}/g, ' ')
                .trim();
            if (nuevo !== el.value) {
                const cambio = nuevo.replace(/\s/g, '') !== el.value.toUpperCase().replace(/\s/g, '');
                el.value = nuevo;
                if (cambio) marcarCorregido(el);
            }
        });

        // ============================================

        function personaSVG(fill) {
            return '<g fill="' + fill + '">' +
                '<circle cx="50" cy="10" r="8"/>' +
                '<rect x="46.5" y="16" width="7" height="6"/>' +
                '<path d="M33 31 Q33 21 43 21 L57 21 Q67 21 67 31 L65 57 L35 57 Z"/>' +
                '<rect x="25" y="23" width="7" height="32" rx="3.5"/>' +
                '<rect x="68" y="23" width="7" height="32" rx="3.5"/>' +
                '<rect x="36" y="56" width="12" height="40" rx="3"/>' +
                '<rect x="52" y="56" width="12" height="40" rx="3"/>' +
                '<rect x="33" y="94" width="15" height="5" rx="2.5"/>' +
                '<rect x="52" y="94" width="15" height="5" rx="2.5"/>' +
                '</g><g fill="#ffffff"><circle cx="47" cy="9" r="1"/><circle cx="53" cy="9" r="1"/></g>';
        }

        // Encuadra la persona mostrando de "arriba" a "abajo" (en unidades del cuerpo) a todo lo alto del cuadro
        function encuadre(W, H, arriba, abajo, cx, fill) {
            const s = H / (abajo - arriba);
            return '<g transform="translate(' + (cx - 50 * s) + ',' + (-arriba * s) + ') scale(' + s + ')">' + personaSVG(fill) + '</g>';
        }

        // Persona de cierta altura con los pies en footY
        function personaEn(cx, footY, alto, fill) {
            const s = alto / 100;
            return '<g transform="translate(' + (cx - 50 * s) + ',' + (footY - 99 * s) + ') scale(' + s + ')">' + personaSVG(fill) + '</g>';
        }

        function camaraIcono(x, y, rot) {
            return '<g transform="translate(' + x + ',' + y + ') rotate(' + rot + ')">' +
                '<rect x="-14" y="-9" width="20" height="18" rx="3" fill="#333"/>' +
                '<path d="M6 -5 L16 -10 L16 10 L6 5 Z" fill="#333"/></g>';
        }

        function dibujarPlano(tipo, W, H) {
            const B = 'var(--brand)';
            const gris = '#9AA7BD';
            const m = Math.min(W, H);
            let s = '';

            switch (tipo) {
                case 'gran-general':
                    s += '<rect width="' + W + '" height="' + H + '" fill="#DCE6F2"/>';
                    s += '<polygon points="0,' + H * 0.7 + ' ' + W * 0.25 + ',' + H * 0.35 + ' ' + W * 0.5 + ',' + H * 0.7 + '" fill="#B8C4D6"/>';
                    s += '<polygon points="' + W * 0.35 + ',' + H * 0.7 + ' ' + W * 0.7 + ',' + H * 0.28 + ' ' + W + ',' + H * 0.7 + '" fill="#A6B4C9"/>';
                    s += '<rect y="' + H * 0.7 + '" width="' + W + '" height="' + H * 0.3 + '" fill="#C9D8B6"/>';
                    s += '<circle cx="' + W * 0.85 + '" cy="' + H * 0.15 + '" r="' + m * 0.06 + '" fill="#F2D57E"/>';
                    s += personaEn(W * 0.5, H * 0.82, H * 0.08, B);
                    break;
                case 'general':
                    s += '<rect y="' + H * 0.85 + '" width="' + W + '" height="' + H * 0.15 + '" fill="#D5DBE4"/>';
                    s += '<rect x="' + W * 0.06 + '" y="' + H * 0.3 + '" width="' + W * 0.22 + '" height="' + H * 0.55 + '" fill="#C8D0DC"/>';
                    s += '<circle cx="' + W * 0.85 + '" cy="' + H * 0.5 + '" r="' + m * 0.12 + '" fill="#BFD0B0"/>';
                    s += '<rect x="' + (W * 0.85 - 3) + '" y="' + H * 0.55 + '" width="6" height="' + H * 0.3 + '" fill="#A99A86"/>';
                    s += personaEn(W * 0.5, H * 0.86, H * 0.45, B);
                    break;
                case 'establecimiento': {
                    const bx = W * 0.12, bw = W * 0.76, by = H * 0.18, bh = H * 0.7;
                    s += '<rect y="' + H * 0.88 + '" width="' + W + '" height="' + H * 0.12 + '" fill="#D5DBE4"/>';
                    s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="#CED5E0"/>';
                    s += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh * 0.16 + '" fill="' + B + '"/>';
                    s += '<rect x="' + (bx + bw * 0.4) + '" y="' + (by + bh * 0.45) + '" width="' + bw * 0.2 + '" height="' + bh * 0.55 + '" fill="#8E99AB"/>';
                    s += '<rect x="' + (bx + bw * 0.08) + '" y="' + (by + bh * 0.3) + '" width="' + bw * 0.24 + '" height="' + bh * 0.35 + '" fill="#EAF0F7"/>';
                    s += '<rect x="' + (bx + bw * 0.68) + '" y="' + (by + bh * 0.3) + '" width="' + bw * 0.24 + '" height="' + bh * 0.35 + '" fill="#EAF0F7"/>';
                    s += personaEn(bx + bw * 0.75, H * 0.92, H * 0.2, gris);
                    break;
                }
                case 'entero':
                    s += '<rect y="' + H * 0.95 + '" width="' + W + '" height="' + H * 0.05 + '" fill="#D5DBE4"/>';
                    s += encuadre(W, H, -4, 103, W / 2, B);
                    break;
                case 'americano':    s += encuadre(W, H, -4, 78, W / 2, B); break;
                case 'medio':        s += encuadre(W, H, -3, 58, W / 2, B); break;
                case 'medio-corto':  s += encuadre(W, H, -3, 42, W / 2, B); break;
                case 'primer-plano': s += encuadre(W, H, -2, 30, W / 2, B); break;
                case 'ppp':          s += encuadre(W, H, 3, 18, W / 2, B); break;
                case 'detalle': {
                    const k = H * 0.9 / 100, ox = W / 2 - 50 * k, oy = H * 0.05;
                    s += '<g transform="translate(' + ox + ',' + oy + ') scale(' + k + ')">' +
                        '<rect x="42" y="2" width="16" height="8" rx="2" fill="#555"/>' +
                        '<rect x="44" y="10" width="12" height="14" fill="#C9D3E0"/>' +
                        '<path d="M44 24 Q30 30 30 42 L30 92 Q30 98 36 98 L64 98 Q70 98 70 92 L70 42 Q70 30 56 24 Z" fill="#C9D3E0"/>' +
                        '<rect x="30" y="50" width="40" height="28" fill="' + B + '"/>' +
                        '<rect x="37" y="58" width="26" height="4" rx="2" fill="#fff"/>' +
                        '<rect x="40" y="66" width="20" height="3" rx="1.5" fill="#fff" opacity="0.7"/>' +
                        '<rect x="34" y="32" width="5" height="60" rx="2.5" fill="#fff" opacity="0.5"/></g>';
                    break;
                }
                case 'conjunto': {
                    const alto = Math.min(H * 0.78, W * 0.75);
                    s += '<rect y="' + H * 0.9 + '" width="' + W + '" height="' + H * 0.1 + '" fill="#D5DBE4"/>';
                    s += personaEn(W / 2 - alto * 0.28, H * 0.92, alto, B);
                    s += personaEn(W / 2 + alto * 0.28, H * 0.92, alto * 0.94, gris);
                    break;
                }
                case 'cenital': {
                    const r = m * 0.36;
                    s += '<rect width="' + W + '" height="' + H + '" fill="#E4E8EE"/>';
                    s += '<circle cx="' + W / 2 + '" cy="' + H * 0.42 + '" r="' + r + '" fill="#C9B79C"/>';
                    s += '<circle cx="' + W / 2 + '" cy="' + H * 0.42 + '" r="' + r * 0.45 + '" fill="#fff"/>';
                    s += '<circle cx="' + W / 2 + '" cy="' + H * 0.42 + '" r="' + r * 0.28 + '" fill="#E8A65A"/>';
                    s += '<ellipse cx="' + W / 2 + '" cy="' + H * 1.02 + '" rx="' + m * 0.32 + '" ry="' + m * 0.16 + '" fill="' + B + '"/>';
                    s += '<circle cx="' + W / 2 + '" cy="' + H * 0.95 + '" r="' + m * 0.1 + '" fill="#3a3a3a"/>';
                    break;
                }
                case 'picado':
                    s += '<rect y="' + H * 0.88 + '" width="' + W + '" height="' + H * 0.12 + '" fill="#D5DBE4"/>';
                    s += '<line x1="' + W * 0.18 + '" y1="' + H * 0.16 + '" x2="' + W * 0.55 + '" y2="' + H * 0.45 + '" stroke="#888" stroke-dasharray="4 4"/>';
                    s += '<g transform="translate(' + W * 0.6 + ',' + H * 0.9 + ') scale(1,0.85) translate(' + (-W * 0.6) + ',' + (-H * 0.9) + ')">' + personaEn(W * 0.6, H * 0.9, H * 0.55, B) + '</g>';
                    s += camaraIcono(W * 0.14, H * 0.13, 38);
                    break;
                case 'contrapicado':
                    s += '<line x1="' + W * 0.18 + '" y1="' + H * 0.86 + '" x2="' + W * 0.55 + '" y2="' + H * 0.3 + '" stroke="#888" stroke-dasharray="4 4"/>';
                    s += personaEn(W * 0.6, H * 0.98, H * 0.92, B);
                    s += camaraIcono(W * 0.14, H * 0.88, -45);
                    break;
                case 'holandes':
                    s += '<g transform="rotate(-14 ' + W / 2 + ' ' + H / 2 + ')">';
                    s += '<rect x="' + (-W) + '" y="' + H * 0.7 + '" width="' + W * 3 + '" height="' + H + '" fill="#D5DBE4"/>';
                    s += encuadre(W, H, -6, 60, W / 2, B) + '</g>';
                    break;
                case 'pov':
                    s += '<rect width="' + W + '" height="' + H + '" fill="#E4E8EE"/>';
                    s += '<polygon points="0,' + H + ' ' + W * 0.35 + ',' + H * 0.55 + ' ' + W * 0.65 + ',' + H * 0.55 + ' ' + W + ',' + H + '" fill="#D2D8E2"/>';
                    s += '<rect x="' + W * 0.38 + '" y="' + H * 0.2 + '" width="' + W * 0.24 + '" height="' + H * 0.35 + '" fill="#9AA7BD"/>';
                    s += '<rect x="' + W * 0.1 + '" y="' + H * 0.62 + '" width="' + m * 0.14 + '" height="' + H * 0.5 + '" rx="' + m * 0.06 + '" fill="' + B + '" transform="rotate(28 ' + W * 0.1 + ' ' + H * 0.62 + ')"/>';
                    s += '<rect x="' + W * 0.82 + '" y="' + H * 0.68 + '" width="' + m * 0.14 + '" height="' + H * 0.5 + '" rx="' + m * 0.06 + '" fill="' + B + '" transform="rotate(-28 ' + W * 0.82 + ' ' + H * 0.68 + ')"/>';
                    s += '<circle cx="' + W * 0.2 + '" cy="' + H * 0.66 + '" r="' + m * 0.075 + '" fill="#D9B48F"/>';
                    s += '<circle cx="' + W * 0.8 + '" cy="' + H * 0.7 + '" r="' + m * 0.075 + '" fill="#D9B48F"/>';
                    break;
                case 'hombro':
                    s += encuadre(W, H, -4, 60, W * 0.64, B);
                    s += '<ellipse cx="' + W * 0.12 + '" cy="' + H * 1.05 + '" rx="' + W * 0.38 + '" ry="' + H * 0.38 + '" fill="#2f2f2f"/>';
                    s += '<circle cx="' + W * 0.14 + '" cy="' + H * 0.48 + '" r="' + m * 0.22 + '" fill="#2f2f2f"/>';
                    break;
                case 'secuencia':
                    s += '<rect y="' + H * 0.88 + '" width="' + W + '" height="' + H * 0.12 + '" fill="#D5DBE4"/>';
                    s += '<path d="M' + W * 0.05 + ' ' + H * 0.8 + ' Q' + W * 0.35 + ' ' + H * 0.55 + ' ' + W * 0.62 + ' ' + H * 0.82 + '" stroke="#888" stroke-width="2" stroke-dasharray="5 5" fill="none"/>';
                    s += personaEn(W * 0.72, H * 0.9, H * 0.5, B);
                    s += camaraIcono(W * 0.12, H * 0.62, 0);
                    break;
                case 'aerea':
                    s += '<rect width="' + W + '" height="' + H + '" fill="#C9D8B6"/>';
                    s += '<rect x="' + W * 0.45 + '" width="' + m * 0.1 + '" height="' + H + '" fill="#A7AEB8"/>';
                    s += '<rect y="' + H * 0.55 + '" width="' + W + '" height="' + m * 0.1 + '" fill="#A7AEB8"/>';
                    s += '<rect x="' + W * 0.1 + '" y="' + H * 0.12 + '" width="' + W * 0.25 + '" height="' + H * 0.3 + '" fill="' + B + '"/>';
                    s += '<rect x="' + W * 0.62 + '" y="' + H * 0.15 + '" width="' + W * 0.25 + '" height="' + H * 0.25 + '" fill="#E1E5EC"/>';
                    s += '<rect x="' + W * 0.12 + '" y="' + H * 0.72 + '" width="' + W * 0.2 + '" height="' + H * 0.2 + '" fill="#E1E5EC"/>';
                    s += '<rect x="' + W * 0.62 + '" y="' + H * 0.72 + '" width="' + W * 0.28 + '" height="' + H * 0.2 + '" fill="#E1E5EC"/>';
                    break;
            }
            return s;
        }

        function flecha(x1, y1, x2, y2, id, doble) {
            return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#E8791E" stroke-width="3" stroke-linecap="round"' +
                ' marker-end="url(#' + id + ')"' + (doble ? ' marker-start="url(#' + id + ')"' : '') + '/>';
        }

        function dibujarMovimiento(mov, W, H, id) {
            const o = '#E8791E';
            switch (mov) {
                case 'paneo':     return flecha(W * 0.2, H * 0.1, W * 0.8, H * 0.1, id, true);
                case 'tilt':      return flecha(W * 0.92, H * 0.15, W * 0.92, H * 0.85, id, true);
                case 'lateral':   return flecha(W * 0.15, H * 0.93, W * 0.85, H * 0.93, id, false);
                case 'grua':      return flecha(W * 0.07, H * 0.8, W * 0.07, H * 0.2, id, true);
                case 'dolly-in':
                case 'zoom-in':
                    return '<rect x="' + W * 0.25 + '" y="' + H * 0.25 + '" width="' + W * 0.5 + '" height="' + H * 0.5 + '" fill="none" stroke="' + o + '" stroke-width="2" stroke-dasharray="6 4"/>' +
                        flecha(W * 0.05, H * 0.07, W * 0.22, H * 0.22, id) + flecha(W * 0.95, H * 0.07, W * 0.78, H * 0.22, id) +
                        flecha(W * 0.05, H * 0.93, W * 0.22, H * 0.78, id) + flecha(W * 0.95, H * 0.93, W * 0.78, H * 0.78, id);
                case 'dolly-out':
                case 'zoom-out':
                    return '<rect x="' + W * 0.25 + '" y="' + H * 0.25 + '" width="' + W * 0.5 + '" height="' + H * 0.5 + '" fill="none" stroke="' + o + '" stroke-width="2" stroke-dasharray="6 4"/>' +
                        flecha(W * 0.22, H * 0.22, W * 0.05, H * 0.07, id) + flecha(W * 0.78, H * 0.22, W * 0.95, H * 0.07, id) +
                        flecha(W * 0.22, H * 0.78, W * 0.05, H * 0.93, id) + flecha(W * 0.78, H * 0.78, W * 0.95, H * 0.93, id);
                case 'seguimiento':
                    return '<path d="M' + W * 0.1 + ' ' + H * 0.92 + ' Q' + W * 0.5 + ' ' + H * 0.8 + ' ' + W * 0.88 + ' ' + H * 0.92 + '" stroke="' + o + '" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#' + id + ')"/>';
                case 'mano': {
                    let p = 'M' + W * 0.15 + ' ' + H * 0.1;
                    for (let i = 1; i <= 8; i++) p += ' L' + (W * 0.15 + i * W * 0.0875) + ' ' + (H * 0.1 + (i % 2 ? -6 : 6));
                    return '<path d="' + p + '" stroke="' + o + '" stroke-width="3" fill="none" stroke-linejoin="round"/>';
                }
                case 'orbital':
                    return '<path d="M' + W * 0.2 + ' ' + H * 0.75 + ' A' + W * 0.32 + ' ' + H * 0.14 + ' 0 1 0 ' + W * 0.8 + ' ' + H * 0.75 + '" stroke="' + o + '" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#' + id + ')"/>';
                case 'dron': {
                    const x = W * 0.85, y = H * 0.15, r = Math.min(W, H) * 0.035;
                    return '<g stroke="#333" stroke-width="2"><line x1="' + (x - r * 2) + '" y1="' + (y - r * 2) + '" x2="' + (x + r * 2) + '" y2="' + (y + r * 2) + '"/><line x1="' + (x + r * 2) + '" y1="' + (y - r * 2) + '" x2="' + (x - r * 2) + '" y2="' + (y + r * 2) + '"/></g>' +
                        '<g fill="none" stroke="#333" stroke-width="1.5"><circle cx="' + (x - r * 2) + '" cy="' + (y - r * 2) + '" r="' + r + '"/><circle cx="' + (x + r * 2) + '" cy="' + (y - r * 2) + '" r="' + r + '"/><circle cx="' + (x - r * 2) + '" cy="' + (y + r * 2) + '" r="' + r + '"/><circle cx="' + (x + r * 2) + '" cy="' + (y + r * 2) + '" r="' + r + '"/></g>' +
                        '<path d="M' + W * 0.2 + ' ' + H * 0.85 + ' Q' + W * 0.4 + ' ' + H * 0.3 + ' ' + W * 0.72 + ' ' + H * 0.2 + '" stroke="' + o + '" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#' + id + ')"/>';
                }
                default: return '';
            }
        }

        function actualizarPreview(n) {
            const plano = document.querySelector('select[name="scene-' + n + '-plano"]');
            const mov = document.querySelector('select[name="scene-' + n + '-movimiento"]');
            const box = document.getElementById('preview-' + n);
            if (!plano || !box) return;

            const tipo = plano.value;
            const movimiento = mov ? mov.value : '';
            if (!tipo && !movimiento) {
                box.classList.remove('visible');
                box.innerHTML = '';
                return;
            }

            const vertical = formatoActual() === 'vertical';
            const W = vertical ? 180 : 320;
            const H = vertical ? 320 : 180;
            const id = 'flecha-' + n;

            const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="max-width:' + (vertical ? 150 : 320) + 'px" role="img" aria-label="Referencia del plano">' +
                '<defs><marker id="' + id + '" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E8791E"/></marker></defs>' +
                '<rect width="' + W + '" height="' + H + '" fill="#EEF2F7"/>' +
                (tipo ? dibujarPlano(tipo, W, H) : '') +
                (movimiento ? dibujarMovimiento(movimiento, W, H, id) : '') +
                '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" fill="none" stroke="#C5CDD9" stroke-width="2"/>' +
                '</svg>';

            let info = '<div class="plano-info">';
            if (tipo) info += '<h4>' + PLANO_INFO[tipo].nombre + '</h4><p>' + PLANO_INFO[tipo].desc + '</p>';
            if (movimiento) info += '<h4>' + MOV_INFO[movimiento].nombre + '</h4><p>' + MOV_INFO[movimiento].desc + '</p>';
            info += '</div>';

            box.innerHTML = svg + info;
            box.classList.add('visible');
        }

        function actualizarTodosLosPreviews() {
            document.querySelectorAll('.scene').forEach(sc => actualizarPreview(sc.id.replace('scene-', '')));
        }

        // ============================================
        // MARCA Y FORMATO
        // ============================================
        let sceneCount = 0;

        document.getElementById('marca').addEventListener('change', function () {
            updateBrand(this.value);
            updateVisibility();
        });

        document.querySelectorAll('input[name="formato"]').forEach(r => {
            r.addEventListener('change', function () {
                document.querySelectorAll('.formato-opcion').forEach(op => op.classList.remove('activa'));
                this.closest('.formato-opcion').classList.add('activa');
                actualizarTodosLosPreviews();
            });
        });

        const logoImg = document.getElementById('brandLogo');
        const logoFallback = document.getElementById('logoFallback');
        logoImg.addEventListener('error', function () {
            logoImg.style.display = 'none';
            logoFallback.style.display = 'block';
        });
        logoImg.addEventListener('load', function () {
            logoImg.style.display = '';
            logoFallback.style.display = 'none';
        });

        function updateBrand(marca) {
            if (!marca) return;
            const brand = brandData[marca];
            document.body.className = brand.theme;
            document.body.style.setProperty('--brand', brand.color);

            logoFallback.textContent = brand.siglas;
            logoImg.src = brand.logo;
            document.getElementById('headerTitle').textContent = brand.name;
            document.getElementById('headerSubtitle').textContent = 'Nuevo Storyboard';
        }

        function updateVisibility() {
            const marca = document.getElementById('marca').value;
            document.getElementById('pillarGroup').style.display = marca === 'vizion' ? 'flex' : 'none';
            document.getElementById('restaurantGroup').style.display = marca === 'donk-restaurant' ? 'flex' : 'none';
        }

        // ============================================
        // ESCENAS
        // ============================================
        function opcionesPlano() {
            return PLANOS.map(g =>
                '<optgroup label="' + g.grupo + '">' +
                g.items.map(([k, n]) => '<option value="' + k + '">' + n + '</option>').join('') +
                '</optgroup>'
            ).join('');
        }

        function opcionesMovimiento() {
            return MOVIMIENTOS.map(([k, n]) => '<option value="' + k + '">' + n + '</option>').join('');
        }

        const T = 'spellcheck="true" autocapitalize="characters"';

        function addScene() {
            sceneCount++;
            const n = sceneCount;
            const scenesContainer = document.getElementById('scenesContainer');

            const sceneHTML = `
                <div class="scene" id="scene-${n}">
                    <div class="scene-header">
                        <span class="scene-number">Escena #${n}</span>
                        <button type="button" class="remove-scene-btn" onclick="removeScene(${n})">Eliminar</button>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Duración (segundos)</label>
                            <input type="number" name="scene-${n}-duration" min="1" max="120" placeholder="15">
                        </div>

                        <div class="form-group">
                            <label>Tipo de plano</label>
                            <select name="scene-${n}-plano" onchange="actualizarPreview(${n})">
                                <option value="">Selecciona...</option>
                                ${opcionesPlano()}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Movimiento de cámara</label>
                            <select name="scene-${n}-movimiento" onchange="actualizarPreview(${n})">
                                <option value="">Selecciona...</option>
                                ${opcionesMovimiento()}
                            </select>
                        </div>
                    </div>

                    <div class="plano-preview" id="preview-${n}"></div>

                    <div class="form-group">
                        <label>¿Qué pasa?</label>
                        <textarea name="scene-${n}-action" placeholder="Describe la acción o idea de la escena" rows="3" ${T}></textarea>
                    </div>

                    <div class="form-group">
                        <label>Mensaje / Copy</label>
                        <textarea name="scene-${n}-copy" placeholder="Texto que aparece en pantalla" rows="2" ${T}></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>¿Lleva diálogo?</label>
                            <select name="scene-${n}-hasDialog" onchange="toggleField(${n}, 'hasDialog', 'dialog-field')">
                                <option value="no">NO</option>
                                <option value="yes">SÍ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>¿Lleva voz en off?</label>
                            <select name="scene-${n}-hasVoiceOver" onchange="toggleField(${n}, 'hasVoiceOver', 'voz-field')">
                                <option value="no">NO</option>
                                <option value="yes">SÍ</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="dialog-field-${n}" style="display: none;">
                        <label>Texto del diálogo</label>
                        <textarea name="scene-${n}-dialog" placeholder="Lo que dicen los actores en cámara" rows="2" ${T}></textarea>
                    </div>

                    <div class="form-group" id="voz-field-${n}" style="display: none;">
                        <label>Texto de la voz en off</label>
                        <textarea name="scene-${n}-voiceOver" placeholder="Lo que dice el narrador (no aparece en cámara)" rows="2" ${T}></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Actores / Elementos</label>
                            <input type="text" name="scene-${n}-actors" list="lista-actores" placeholder="Ej: Cliente, encargado, producto" ${T}>
                        </div>

                        <div class="form-group">
                            <label>Locación</label>
                            <input type="text" name="scene-${n}-location" list="lista-locaciones" placeholder="Interior / Exterior / Fachada" ${T}>
                        </div>
                    </div>

                    <div class="form-grid-full">
                        <div class="form-group">
                            <label>Props / Elementos de set</label>
                            <input type="text" name="scene-${n}-props" placeholder="Cámaras, pantallas, producto, etc." ${T}>
                        </div>

                        <div class="form-group">
                            <label>Notas adicionales</label>
                            <textarea name="scene-${n}-notes" placeholder="Anotaciones, efectos especiales, etc." rows="2" ${T}></textarea>
                        </div>
                    </div>
                </div>
            `;

            scenesContainer.insertAdjacentHTML('beforeend', sceneHTML);
            renumerarEscenas();
        }

        function removeScene(id) {
            const el = document.getElementById('scene-' + id);
            if (el) el.remove();
            renumerarEscenas();
        }

        function renumerarEscenas() {
            document.querySelectorAll('.scene').forEach((sc, i) => {
                sc.querySelector('.scene-number').textContent = 'Escena #' + (i + 1);
            });
        }

        function toggleField(n, campo, prefijo) {
            const select = document.querySelector('select[name="scene-' + n + '-' + campo + '"]');
            const field = document.getElementById(prefijo + '-' + n);
            field.style.display = select.value === 'yes' ? 'flex' : 'none';
        }

        // ============================================
        // ENVIAR A APPS SCRIPT
        // ============================================
        document.getElementById('storyboardForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formato = document.querySelector('input[name="formato"]:checked');

            const datos = {
                marca: document.getElementById('marca').value,
                pilar: document.getElementById('pilar').value,
                restaurant: document.getElementById('restaurant').value,
                mesAno: (document.getElementById('anoSel').value && document.getElementById('mesSel').value)
                    ? (document.getElementById('anoSel').value + '-' + document.getElementById('mesSel').value)
                    : '',
                videoName: document.getElementById('videoName').value.trim().toUpperCase(),
                scriptLink: document.getElementById('scriptLink').value.trim(),
                formato: formato ? formato.value : '',
                escenas: []
            };

            if (datos.marca === 'vizion' && !datos.pilar) {
                mostrarResultado('Selecciona el pilar de contenido de VIZIÓN.', 'error');
                return;
            }
            if (datos.marca === 'donk-restaurant' && !datos.restaurant) {
                mostrarResultado('Selecciona si es Bar Don K o Restaurante.', 'error');
                return;
            }

            document.querySelectorAll('.scene').forEach(function (scene) {
                const id = scene.id.replace('scene-', '');
                function val(name) {
                    const el = scene.querySelector('[name="scene-' + id + '-' + name + '"]');
                    return el ? el.value.trim() : '';
                }
                datos.escenas.push({
                    duration: val('duration'),
                    plano: val('plano'),
                    movimiento: val('movimiento'),
                    action: val('action'),
                    copy: val('copy'),
                    hasDialog: val('hasDialog'),
                    dialog: val('dialog'),
                    hasVoiceOver: val('hasVoiceOver'),
                    voiceOver: val('voiceOver'),
                    actors: val('actors'),
                    location: val('location'),
                    props: val('props'),
                    notes: val('notes')
                });
            });

            const btn = document.querySelector('.submit-btn');
            const textoOriginal = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Creando en Google Drive...';
            mostrarResultado('', 'loading');

            function terminar(res) {
                btn.disabled = false;
                btn.textContent = textoOriginal;
                if (res && res.ok) mostrarResultado(res, 'success');
                else mostrarResultado((res && res.error) || 'No hubo respuesta del servidor.', 'error');
            }
            function fallo(err) {
                btn.disabled = false;
                btn.textContent = textoOriginal;
                mostrarResultado((err && err.message) || String(err), 'error');
            }

            // Si la página la sirve Apps Script, usa google.script.run
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(terminar).withFailureHandler(fallo).crearStoryboard(datos);
                return;
            }

            // Desde GitHub Pages: enviar a la URL del Apps Script
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('script.google.com') === -1) {
                fallo(new Error('Falta pegar la URL del Apps Script en APPS_SCRIPT_URL (al inicio del código).'));
                return;
            }
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(datos)
            })
                .then(r => r.json())
                .then(terminar)
                .catch(fallo);
        });

        function mostrarResultado(res, tipo) {
            let panel = document.getElementById('resultPanel');
            if (!panel) {
                panel = document.createElement('div');
                panel.id = 'resultPanel';
                panel.style.marginTop = '20px';
                panel.style.padding = '20px';
                panel.style.borderRadius = '8px';
                panel.style.fontSize = '14px';
                panel.style.fontWeight = '600';
                document.querySelector('.content').appendChild(panel);
            }

            if (tipo === 'loading') {
                panel.style.background = '#fff8e1';
                panel.style.color = '#f57f17';
                panel.innerHTML = '⏳ Creando carpetas y documento en Google Drive...';
            } else if (tipo === 'success') {
                panel.style.background = '#e8f5e9';
                panel.style.color = '#2e7d32';
                panel.innerHTML = '✅ <strong>¡Storyboard creado!</strong><br><br>' +
                    '📄 <a href="' + res.docUrl + '" target="_blank" style="color:#1565c0;">Abrir documento: ' + res.docNombre + '</a><br>' +
                    '📁 <a href="' + res.carpetaUrl + '" target="_blank" style="color:#1565c0;">Ver carpeta en Drive</a>';
            } else if (tipo === 'error') {
                panel.style.background = '#ffebee';
                panel.style.color = '#c62828';
                panel.innerHTML = '❌ <strong>Error:</strong> ' + res;
            }
            panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Primera escena por defecto
        window.addEventListener('load', addScene);
    </script>
</body>
</html>
